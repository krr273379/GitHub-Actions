name: Self-Hosted Runner Test

on:
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  test-runner:
    runs-on: [self-hosted, aosp, 014]  # Targets your self-hosted runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create directory and file
        run: |
          mkdir -p actions-test
          echo "This file was created by GitHub Actions on runner $(hostname)" > actions-test/actions-test
          echo "✅ File created successfully!"
          ls -l actions-test/
